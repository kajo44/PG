name: GeoSurvey Jalan Next - Source Audit

on:
  push:
    branches:
      - geosurvey-jalan-next
    paths:
      - 'pkrms-geosurvey-pro.zip'
      - 'GeoSurveyJalan_Next/tools/audit_source_zip.py'
      - '.github/workflows/geosurvey-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: geosurvey-jalan-next
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory and safely extract ZIP
        run: python GeoSurveyJalan_Next/tools/audit_source_zip.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source dependencies
        working-directory: GeoSurveyJalan_Next/source_snapshot
        run: npm install --no-audit --no-fund
        continue-on-error: true
      - name: TypeScript check
        working-directory: GeoSurveyJalan_Next/source_snapshot
        run: npm run lint
        continue-on-error: true
      - name: Production build
        working-directory: GeoSurveyJalan_Next/source_snapshot
        run: npm run build
        continue-on-error: true
      - name: Persist extracted baseline and audit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GeoSurveyJalan_Next/source_snapshot/ GeoSurveyJalan_Next/audit/
          if ! git diff --cached --quiet; then
            git commit -m "Add extracted GeoSurvey Jalan Next source baseline"
            git push origin HEAD:geosurvey-jalan-next
          fi
      - name: Upload audit report and extracted baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geosurvey-source-audit
          path: |
            GeoSurveyJalan_Next/audit/
            GeoSurveyJalan_Next/source_snapshot/
          if-no-files-found: warn
          retention-days: 7
